<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>✊ Rock Paper Scissors ✋</h1>

    <div class="score-board">
        <div class="score">
            <h3>You</h3>
            <p id="player-score">0</p>
        </div>

        <div class="score">
            <h3>Computer</h3>
            <p id="computer-score">0</p>
        </div>
    </div>

    <div class="battle-area">

        <div class="player-box">
            <h2>You</h2>
            <div class="choice" id="user-choice">❔</div>
        </div>

        <div class="vs">VS</div>

        <div class="player-box">
            <h2>Computer</h2>
            <div class="choice" id="computer-choice">❔</div>
        </div>

    </div>

    <h2 class="result">
        <span id="result">Choose your move!</span>
    </h2>

    <div class="buttons">
        <button class="chooice-btn" id="rock">🪨 Rock</button>
        <button class="chooice-btn" id="paper">📄 Paper</button>
        <button class="chooice-btn" id="scissors">✂️ Scissors</button>
    </div>

    <button id="restart">🔄 Reset Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
